<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mandi Ledger</title>
    <meta name="description" content="Multi-commodity agricultural marketplace settlement tracker & auction ledger for all mandis (grains, pulses, vegetables, fruits, flowers, cotton, and spices) with dynamic commission deductions, farmer accounts, and PDF settlement reports." />
    <meta property="og:title" content="Mandi Ledger" />
    <meta property="og:description" content="Multi-commodity agricultural marketplace settlement tracker & auction ledger for all mandis (grains, pulses, vegetables, fruits, flowers, cotton, and spices) with dynamic commission deductions, farmer accounts, and PDF settlement reports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Web App Manifest for PWABuilder, Android APK, and Chrome -->
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#1B4D3E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mandi Ledger" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/pwa-192x192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">

    <!-- Immediate Service Worker Registration for PWABuilder & PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('ServiceWorker registered with scope: ', reg.scope);
            })
            .catch(function(err) {
              console.warn('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </head>
  <body class="bg-[#FCFBF9] text-[#2A1F1A] antialiased selection:bg-[#DD9F2F]/30 selection:text-[#2A1F1A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
